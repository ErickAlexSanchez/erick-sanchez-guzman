<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Erick Alexander Sánchez Guzmán — Senior Frontend Engineer</title>
    <meta
      name="description"
      content="Senior Frontend Engineer in Mexico City. Six architecture decisions, with local demos, for US and UK teams."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        var theme = localStorage.getItem("portfolio-theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.setAttribute("data-theme", theme);
        }
        var locale = localStorage.getItem("portfolio-locale");
        if (locale === "es" || locale === "en") {
          document.documentElement.lang = locale;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
